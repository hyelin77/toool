<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관계도 / 커플링 틀 생성기</title>
    <!-- HTML 요소를 이미지로 변환해주는 html2canvas 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            user-select: none;
        }

        /* 컨트롤 영역 (저장 버튼 위치) */
        .control-panel {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            background-color: #4c6ef5;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76, 110, 245, 0.3);
            transition: all 0.2s;
        }

        .save-btn:hover {
            background-color: #3b5bdb;
            transform: translateY(-1px);
        }

        /* 메인 캔버스 영역 */
        .stage-container {
            position: relative;
            width: 850px;
            height: 850px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* 좌측 상단 범례 */
        .legend-container {
            position: absolute;
            top: 25px;
            left: 25px;
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            border: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }

        .legend-item:hover {
            background-color: #f8f9fa;
        }

        .legend-item.selected {
            border-color: #333;
            background-color: #f1f3f5;
        }

        .legend-item.cancel-mode.selected {
            border-color: #ff4757;
            background-color: #ffe0e3;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        /* SVG 라인 캔버스 */
        #svgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        #svgCanvas g {
            pointer-events: auto;
            cursor: pointer;
        }

        #svgCanvas line {
            transition: stroke-width 0.2s;
        }

        #svgCanvas g:hover line {
            stroke-width: 6;
            opacity: 0.8;
        }

        #svgCanvas text {
            font-size: 12px;
            font-weight: 600;
            fill: #212529;
            text-anchor: middle;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 4px;
            stroke-linejoin: round;
        }

        /* 원형 노드 기본 스타일 */
        .circle-node {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #e9ecef;
            border: 3px solid #ced4da;
            transform: translate(-50%, -50%);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
        }

        .circle-node:hover {
            border-color: #4c6ef5;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .circle-node.connecting {
            border-color: #ff6b6b !important;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.8);
        }

        .circle-node.center-node {
            border: 3px solid #748ffc;
            background-color: #edf2ff;
            z-index: 20;
        }

        .circle-node span {
            font-size: 12px;
            color: #868e96;
            text-align: center;
            pointer-events: none; 
            padding: 4px;
        }

        /* 이미지 저장 시에만 적용할 클래스 */
        .exporting .circle-node {
            border: none !important;
            box-shadow: none !important;
        }

        .exporting .cancel-mode {
            display: none !important;
        }

        #imageInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 저장 버튼 패널 -->
    <div class="control-panel">
        <button class="save-btn" id="saveBtn">📷 이미지로 저장</button>
    </div>

    <!-- 메인 원형 배치 원판 -->
    <div class="stage-container" id="stage">

        <!-- 좌측 상단 범례 -->
        <div class="legend-container" id="legendContainer">
            
            <div class="legend-item" data-color="#ff4757">
                <div class="legend-color" style="background-color: #FF5675;"></div>
                <span>혐관</span>
            </div>
            <div class="legend-item" data-color="#ffa502">
                <div class="legend-color" style="background-color: #FF9100;"></div>
                <span>일방적 혐관</span>
            </div>
            <div class="legend-item" data-color="#eccc68">
                <div class="legend-color" style="background-color: #FFD232;"></div>
                <span>친혐관</span>
            </div>
            <div class="legend-item" data-color="#2ed573">
                <div class="legend-color" style="background-color: 	#8AE634;"></div>
                <span>친관</span>
            </div>
            <div class="legend-item" data-color="#70a1ff">
                <div class="legend-color" style="background-color: #3CB4FF;"></div>
                <span>평범</span>
            </div>
            <div class="legend-item" data-color="#2f3542">
                <div class="legend-color" style="background-color: #2f3542;"></div>
                <span>불편한 사이</span>
            </div>
            <div class="legend-item cancel-mode" data-action="delete">
                <div class="legend-color" style="background-color: #333;">✕</div>
                <span style="color: #d63031;">관계 삭제</span>
            </div>
        </div>

        <!-- 관계 선을 그리는 SVG Layer -->
        <svg id="svgCanvas">
            <defs id="markerDefs"></defs>
        </svg>

        <!-- 중앙 원 -->
        <div class="circle-node center-node" id="centerNode" style="left: 425px; top: 425px;">
            <span>중앙 (더블클릭)</span>
        </div>
    </div>

    <!-- 숨겨진 이미지 파일 업로더 -->
    <input type="file" id="imageInput" accept="image/*">

    <script>
        const stage = document.getElementById('stage');
        const svgCanvas = document.getElementById('svgCanvas');
        const markerDefs = document.getElementById('markerDefs');
        const imageInput = document.getElementById('imageInput');
        const centerNode = document.getElementById('centerNode');
        const legendItems = document.querySelectorAll('.legend-item');
        const saveBtn = document.getElementById('saveBtn');
        
        let outerCircles = []; 
        let targetCircleForImage = null; 
        const STAGE_RADIUS = 280; 

        let selectedColor = null; 
        let isDeleteMode = false; 
        let firstSelectedCircle = null; 
        let linesData = []; 

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // [범례 선택 이벤트]
        legendItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();

                const action = item.getAttribute('data-action');

                if (item.classList.contains('selected')) {
                    clearLegendSelection();
                } else {
                    legendItems.forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');

                    if (action === 'delete') {
                        isDeleteMode = true;
                        selectedColor = null;
                    } else {
                        isDeleteMode = false;
                        selectedColor = item.getAttribute('data-color');
                    }
                }
                resetConnectingState();
            });
        });

        function clearLegendSelection() {
            legendItems.forEach(i => i.classList.remove('selected'));
            selectedColor = null;
            isDeleteMode = false;
        }

        // [원 위치 정렬 및 연결된 선 좌표 재갱신]
        function rearrangeCircles() {
            const count = outerCircles.length;
            if (count > 0) {
                const angleStep = (2 * Math.PI) / count;
                const startAngle = -Math.PI / 2; 

                outerCircles.forEach((circle, index) => {
                    const angle = startAngle + index * angleStep;
                    const x = 425 + STAGE_RADIUS * Math.cos(angle);
                    const y = 425 + STAGE_RADIUS * Math.sin(angle);

                    circle.style.left = `${x}px`;
                    circle.style.top = `${y}px`;
                });
            }
            updateAllLinesPosition();
        }

        // [색상별 화살표 마커 가져오기 또는 생성]
        function getOrCreateMarker(color) {
            const markerId = 'arrow-' + color.replace('#', '');
            if (!document.getElementById(markerId)) {
                const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                marker.setAttribute('id', markerId);
                marker.setAttribute('viewBox', '0 0 10 10');
                marker.setAttribute('refX', '7');
                marker.setAttribute('refY', '5');
                marker.setAttribute('markerWidth', '6');
                marker.setAttribute('markerHeight', '6');
                marker.setAttribute('orient', 'auto-start-reverse');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M 0 1 L 10 5 L 0 9 z');
                path.setAttribute('fill', color);

                marker.appendChild(path);
                markerDefs.appendChild(marker);
            }
            return markerId;
        }

        function getCircleId(circle) {
            if (circle === centerNode) return 'center';
            return 'outer_' + outerCircles.indexOf(circle);
        }

        // [선 좌표 및 글자 위치 정렬 - 글자 중앙 배치]
        function updateAllLinesPosition() {
            const pairMap = new Map();

            linesData.forEach(item => {
                const id1 = getCircleId(item.fromCircle);
                const id2 = getCircleId(item.toCircle);
                const key = id1 < id2 ? `${id1}_${id2}` : `${id2}_${id1}`;

                if (!pairMap.has(key)) {
                    pairMap.set(key, []);
                }
                pairMap.get(key).push(item);
            });

            const circleRadius = 45; 
            const offsetDist = 14; 
            const textOffsetDist = 0; // 글자가 정확히 선의 중앙에 위치하도록 오프셋 0 설정[cite: 12]

            pairMap.forEach(lines => {
                const total = lines.length;

                lines.forEach((item, idx) => {
                    const fx = item.fromCircle.offsetLeft;
                    const fy = item.fromCircle.offsetTop;
                    const tx = item.toCircle.offsetLeft;
                    const ty = item.toCircle.offsetTop;

                    const dx = tx - fx;
                    const dy = ty - fy;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist === 0) return;

                    const ux = dx / dist;
                    const uy = dy / dist;

                    // 자기 진행 방향 기준 우측 법선 벡터
                    const nx = -uy;
                    const ny = ux;

                    let finalOffset = 0;
                    if (total === 1) {
                        finalOffset = 0;
                    } else if (total === 2) {
                        if (idx === 1) {
                            const firstItem = lines[0];
                            const isReverse = (firstItem.fromCircle === item.toCircle && firstItem.toCircle === item.fromCircle);
                            finalOffset = isReverse ? offsetDist : -offsetDist;
                        } else {
                            finalOffset = offsetDist;
                        }
                    }

                    const startX = fx + ux * circleRadius + nx * finalOffset;
                    const startY = fy + uy * circleRadius + ny * finalOffset;
                    const endX = tx - ux * circleRadius + nx * finalOffset;
                    const endY = ty - uy * circleRadius + ny * finalOffset;

                    item.lineElement.setAttribute('x1', startX);
                    item.lineElement.setAttribute('y1', startY);
                    item.lineElement.setAttribute('x2', endX);
                    item.lineElement.setAttribute('y2', endY);

                    // 글자를 정확히 선 중앙 위치에 설정
                    if (item.textElement) {
                        const midX = (startX + endX) / 2 + nx * textOffsetDist;
                        const midY = (startY + endY) / 2 + ny * textOffsetDist;

                        item.textElement.setAttribute('x', midX);

                        const tspans = item.textElement.querySelectorAll('tspan');
                        const totalLines = tspans.length;
                        const lineHeight = 14; 
                        
                        tspans.forEach((tspan, index) => {
                            tspan.setAttribute('x', midX);
                            const offsetY = midY - ((totalLines - 1) * lineHeight / 2) + (index * lineHeight);
                            tspan.setAttribute('y', offsetY);
                        });
                    }
                });
            });
        }

        function renderMultilineText(textElement, textContent) {
            textElement.innerHTML = '';
            if (!textContent) return;

            const lines = textContent.split('\n');
            lines.forEach(lineText => {
                const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tspan.textContent = lineText;
                textElement.appendChild(tspan);
            });
        }

        function resetConnectingState() {
            if (firstSelectedCircle) {
                firstSelectedCircle.classList.remove('connecting');
                firstSelectedCircle = null;
            }
        }

        // [원 클릭 이벤트]
        function setupCircleEvents(circleElement) {
            circleElement.addEventListener('click', (e) => {
                e.stopPropagation();

                if (selectedColor) {
                    if (!firstSelectedCircle) {
                        firstSelectedCircle = circleElement;
                        circleElement.classList.add('connecting');
                    } else if (firstSelectedCircle === circleElement) {
                        resetConnectingState();
                    } else {
                        const existingLines = linesData.filter(
                            item => (item.fromCircle === firstSelectedCircle && item.toCircle === circleElement) ||
                                    (item.fromCircle === circleElement && item.toCircle === firstSelectedCircle)
                        );

                        if (existingLines.length >= 2) {
                            alert('두 원 사이에는 최대 2개의 선만 연결할 수 있습니다.');
                            resetConnectingState();
                            return;
                        }

                        createLine(firstSelectedCircle, circleElement, selectedColor);
                        resetConnectingState();
                    }
                } 
                else if (isDeleteMode) {
                    if (!firstSelectedCircle) {
                        firstSelectedCircle = circleElement;
                        circleElement.classList.add('connecting');
                    } else if (firstSelectedCircle === circleElement) {
                        resetConnectingState();
                    } else {
                        removeLineBetween(firstSelectedCircle, circleElement);
                        resetConnectingState();
                    }
                }
            });

            circleElement.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                resetConnectingState();
                targetCircleForImage = circleElement;
                imageInput.click();
            });

            circleElement.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (circleElement.classList.contains('center-node')) {
                    alert('중앙 원은 삭제할 수 없습니다.');
                    return;
                }

                removeLinesByCircle(circleElement);
                outerCircles = outerCircles.filter(item => item !== circleElement);
                circleElement.remove();
                rearrangeCircles();
            });
        }

        // [화살표 선 생성]
        function createLine(fromCircle, toCircle, color) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            const markerId = getOrCreateMarker(color);

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('marker-end', `url(#${markerId})`);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

            group.appendChild(line);
            group.appendChild(text);

            const lineObj = {
                fromCircle: fromCircle,
                toCircle: toCircle,
                groupElement: group,
                lineElement: line,
                textElement: text,
                rawText: ""
            };

            group.addEventListener('click', (e) => {
                e.stopPropagation();
                
                const newText = prompt("선에 대한 설명을 입력하세요.\n(줄바꿈을 하려면 문장 사이에 \\n 을 입력하세요)", lineObj.rawText);
                
                if (newText !== null) {
                    if (newText.trim() === "") {
                        group.remove();
                        linesData = linesData.filter(item => item.groupElement !== group);
                    } else {
                        lineObj.rawText = newText;
                        const formattedText = newText.replace(/\\n/g, '\n');
                        renderMultilineText(text, formattedText);
                    }
                    updateAllLinesPosition();
                }
            });

            svgCanvas.appendChild(group);
            linesData.push(lineObj);

            updateAllLinesPosition();
        }

        function removeLineBetween(circleA, circleB) {
            const targets = linesData.filter(
                item => (item.fromCircle === circleA && item.toCircle === circleB) ||
                        (item.fromCircle === circleB && item.toCircle === circleA)
            );

            targets.forEach(item => {
                item.groupElement.remove();
            });

            linesData = linesData.filter(
                item => !((item.fromCircle === circleA && item.toCircle === circleB) ||
                          (item.fromCircle === circleB && item.toCircle === circleA))
            );

            updateAllLinesPosition();
        }

        function removeLinesByCircle(circleElement) {
            const linesToRemove = linesData.filter(
                item => item.fromCircle === circleElement || item.toCircle === circleElement
            );

            linesToRemove.forEach(item => {
                item.groupElement.remove();
            });

            linesData = linesData.filter(
                item => item.fromCircle !== circleElement && item.toCircle !== circleElement
            );

            updateAllLinesPosition();
        }

        stage.addEventListener('click', (e) => {
            if (e.target === stage || e.target === svgCanvas) {
                clearLegendSelection();
                resetConnectingState();
            }
        });

        stage.addEventListener('contextmenu', (e) => {
            e.preventDefault();

            if (e.target === stage || e.target === svgCanvas) {
                const newCircle = document.createElement('div');
                newCircle.className = 'circle-node';
                
                const label = document.createElement('span');
                label.innerText = '이미지 추가';
                newCircle.appendChild(label);

                stage.appendChild(newCircle);
                outerCircles.push(newCircle);

                setupCircleEvents(newCircle);
                rearrangeCircles();
            }
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && targetCircleForImage) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    targetCircleForImage.style.backgroundImage = `url('${event.target.result}')`;
                    
                    const span = targetCircleForImage.querySelector('span');
                    if (span) span.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
            imageInput.value = '';
        });

        // [이미지 저장 기능]
        saveBtn.addEventListener('click', () => {
            clearLegendSelection();
            resetConnectingState();

            stage.classList.add('exporting');

            html2canvas(stage, {
                scale: 2, 
                useCORS: true, 
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '관계도_결과.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                stage.classList.remove('exporting');
            }).catch(() => {
                stage.classList.remove('exporting');
            });
        });

        setupCircleEvents(centerNode);

        for (let i = 0; i < 6; i++) {
            const circle = document.createElement('div');
            circle.className = 'circle-node';
            
            const label = document.createElement('span');
            label.innerText = '이미지 추가';
            circle.appendChild(label);

            stage.appendChild(circle);
            outerCircles.push(circle);
            setupCircleEvents(circle);
        }

        rearrangeCircles();
    </script>
</body>
</html>
